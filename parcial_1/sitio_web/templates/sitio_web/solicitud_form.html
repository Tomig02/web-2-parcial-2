{% extends "base.html" %}

{% block title %}Gestionar solicitud{% endblock %}

{% block content %}

<div class="modal-form-container">

    <form method="POST">

        {% csrf_token %}

        <h1>
            {% if object %}
                Editar solicitud
            {% else %}
                Nueva solicitud
            {% endif %}
        </h1>

        {{ form.as_p }}

        <button type="submit">Guardar</button>

        <p>
            <a href="{% url 'panel_solicitudes' %}">
                Volver al panel
            </a>
        </p>

    </form>

</div>

{% endblock %}
