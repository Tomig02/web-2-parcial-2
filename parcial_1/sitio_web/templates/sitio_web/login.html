{% extends "base.html" %}
{% load static %}

{% block title %}Iniciar sesión{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{% static 'sitio_web/css/form-modal.css' %}">
{% endblock %}

{% block content %}
<div class="modal-form-container">

    <h1>Iniciar sesión</h1>

    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Ingresar</button>
    </form>

    <a href="{% url 'registro' %}">Crear cuenta</a>

</div>
{% endblock %}
