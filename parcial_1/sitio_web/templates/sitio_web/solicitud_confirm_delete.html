{% extends "base.html" %}

{% block title %}Eliminar solicitud{% endblock %}

{% block content %}

<div class="modal-form-container">

    <form method="POST">

        {% csrf_token %}

        <h1>Eliminar solicitud</h1>

        <p>
            ¿Estás seguro de que querés eliminar la solicitud
            de {{ object.nombre }}?
        </p>

        <button type="submit">
            Confirmar eliminación
        </button>

        <p>
            <a href="{% url 'panel_solicitudes' %}">
                Cancelar
            </a>
        </p>

    </form>

</div>

{% endblock %}
