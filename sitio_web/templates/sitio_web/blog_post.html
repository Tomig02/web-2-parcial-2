<!-- Micro Post / Small Bite Card -->
<article class="post-card">
    <div class="post-card__image-wrapper">
        {% if post.featured_image %}
            <img src="{{ post.featured_image.url }}" alt="{{ post.title }}" class="post-card__image" loading="lazy">
        {% else %}
            <img src="/static/images/placeholder-blog.jpg" alt="{{ post.title }}" class="post-card__image">
        {% endif %}
    </div>

    <div class="post-card__content">
        <div class="post-card__meta">
            <span class="post-card__date">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                {{ post.created_at|date:"d M, Y" }}
            </span>
        </div>

        <h3 class="post-card__title">{{ post.title }}</h3>

        <!-- Contenido completo renderizado directamente -->
        <div class="post-card__body">
            {{ post.content|safe }}
        </div>

        {% if post.tip_note %}
        <!-- Bloque opcional para tip o dato clave -->
        <div class="post-card__highlight">
            <strong>Dato clave:</strong> {{ post.tip_note }}
        </div>
        {% endif %}
    </div>
</article>

<style>
/* --- ESTILOS DE MICRO-POSTEO / SMALL BITES --- */
.post-card {
    background-color: #FFFFFF;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(42, 77, 56, 0.05);
    border: 1px solid rgba(42, 77, 56, 0.08);
    display: flex;
    flex-direction: column;
    height: 100%;
}

.post-card__image-wrapper {
    position: relative;
    width: 100%;
    height: 180px;
    overflow: hidden;
    background-color: #F5F2EA;
}

.post-card__image {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.post-card__category {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    background-color: rgba(245, 242, 234, 0.95);
    backdrop-filter: blur(4px);
    color: #2A4D38;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 10px;
    border-radius: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}

.post-card__content {
    padding: 20px;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.post-card__meta {
    display: flex;
    gap: 14px;
    font-size: 0.78rem;
    color: #707571;
    margin-bottom: 8px;
}

.post-card__meta span {
    display: flex;
    align-items: center;
    gap: 4px;
}

.post-card__title {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.3;
    color: #2A4D38;
    margin: 0 0 12px 0;
}

.post-card__body {
    font-size: 0.9rem;
    line-height: 1.55;
    color: #4A4E4B;
    margin-bottom: 14px;
    flex-grow: 1;
}

.post-card__body p {
    margin: 0 0 8px 0;
}

.post-card__body p:last-child {
    margin-bottom: 0;
}

.post-card__highlight {
    background-color: #F5F2EA;
    border-left: 3px solid #2A4D38;
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 0.82rem;
    color: #2A4D38;
    line-height: 1.4;
    margin-top: auto;
}
</style>
